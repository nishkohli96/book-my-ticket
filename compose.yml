services:
  traefik:
    image: traefik:v3.1
    command:
      - '--providers.docker=true'
      - '--providers.docker.exposedbydefault=false'
      - '--entrypoints.web.address=:80'
    # the one public port every backend service routes through
    ports:
      - '80:80'
    volumes:
      # Traefik's Docker provider discovers containers/labels by querying
      # the Docker API - without this mount it can't see anything, which
      # is exactly the "Cannot connect to the Docker daemon" error.
      - /var/run/docker.sock:/var/run/docker.sock:ro

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '3000:3000'
    env_file:
      - apps/web/.env
    environment:
      # Overrides apps/web/.env's localhost value - inside this network,
      # the gateway is reached by service name, not localhost.
      - GATEWAY_URL=http://traefik
    depends_on:
      - user-service

  user-service:
    build:
      context: .
      dockerfile: apps/user-service/Dockerfile
    env_file:
      - apps/user-service/.env
    labels:
      - 'traefik.enable=true'
      # Only service behind the gateway today, so a plain /api prefix is
      # enough - once a second service exists, split into more specific
      # prefixes (e.g. /api/users, /api/bookings) with per-router priority.
      - 'traefik.http.routers.user-service.rule=PathPrefix(`/api`)'
      - 'traefik.http.services.user-service.loadbalancer.server.port=8001'
    # No "expose"/"ports" - only traefik reaches this container; nothing
    # outside the compose network (including the host) can hit it directly.
