services:
  traefik:
    image: traefik:v3.1
    command:
      - '--providers.docker=true'
      - '--providers.docker.exposedbydefault=false'
      - '--entrypoints.web.address=:80'
    # the one public port every backend service routes through
    ports:
      - '80:80'
    volumes:
      # Traefik's Docker provider discovers containers/labels by querying
      # the Docker API - without this mount it can't see anything, which
      # is exactly the "Cannot connect to the Docker daemon" error.
      - /var/run/docker.sock:/var/run/docker.sock:ro

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '3000:3000'
    env_file:
      - apps/web/.env
    environment:
      # Overrides apps/web/.env's localhost value - inside this network,
      # the gateway is reached by service name, not localhost.
      - GATEWAY_URL=http://traefik
    depends_on:
      - user-service
      - event-service
      - booking-service

  user-service:
    build:
      context: .
      dockerfile: apps/user-service/Dockerfile
    env_file:
      - apps/user-service/.env
    labels:
      - 'traefik.enable=true'
      # Each service owns one public prefix; the gateway forwards nothing else.
      - 'traefik.http.routers.user-service.rule=PathPrefix(`/api/user`)'
      - 'traefik.http.services.user-service.loadbalancer.server.port=8001'
    # No "expose"/"ports" - only traefik reaches this container; nothing
    # outside the compose network (including the host) can hit it directly.

  event-service:
    build:
      context: .
      dockerfile: apps/event-service/Dockerfile
    env_file:
      - apps/event-service/.env
    labels:
      - 'traefik.enable=true'
      # Only /api/event is public. The /internal/seats routes booking-service
      # calls are reachable on the compose network but never through the gateway.
      - 'traefik.http.routers.event-service.rule=PathPrefix(`/api/event`)'
      - 'traefik.http.services.event-service.loadbalancer.server.port=8002'

  booking-service:
    build:
      context: .
      dockerfile: apps/booking-service/Dockerfile
    env_file:
      - apps/booking-service/.env
    environment:
      # Talks to event-service directly by service name, not via the gateway.
      - EVENT_SERVICE_URL=http://event-service:8002
    depends_on:
      - event-service
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.booking-service.rule=PathPrefix(`/api/booking`)'
      - 'traefik.http.services.booking-service.loadbalancer.server.port=8003'
